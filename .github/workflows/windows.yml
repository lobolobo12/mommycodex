name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
name: Windows installer
- run: pnpm install --frozen-lockfile
      - run: npm install --global @openai/codex@0.153.4
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        env:
          MOMMYCODEX_TEST_INSTALLED_CODEX: '1'
      - run: node --test scripts/browser.test.mjs
      - run: pnpm tauri build --bundles nsis
      - name: Install and smoke test the packaged app
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'MommyCodex Installed'
          $install = Start-Process $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          node scripts/windows-smoke.mjs "$installDir/MommyCodex.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: MommyCodex-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
