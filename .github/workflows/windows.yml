name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['persona/**', 'src/**', 'src-tauri/**', 'scripts/**', 'Install-Windows.cmd', 'package.json', 'pnpm-lock.yaml', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      pnpm_config_verify_deps_before_run: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @openai/codex@0.153.4
      - name: Check Windows setup with isolated fixtures
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-windows.test.ps1
      - run: pnpm test
      - run: pnpm build
      - name: Verify new workbench and chat workflows
        run: |
          node scripts/additions-ui.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Workbench UI tests failed' }
          node scripts/btw-files-ui.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Chat and Markdown UI tests failed' }
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
        env:
          MOMMYCODEX_TEST_INSTALLED_CODEX: '1'
      - run: node --test scripts/browser.test.mjs
      - run: pnpm tauri build --bundles nsis
      - name: Package the double-click Windows setup
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1
      - name: Install through setup and smoke test the packaged app
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'MommyCodex Installed'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File output/windows-release/MommyCodex-Windows-Setup/scripts/install-windows.ps1 -SkipLogin -SkipLaunch -InstallDirectory $installDir
          if ($LASTEXITCODE -ne 0) { throw 'Double-click setup failed' }
          node scripts/windows-smoke.mjs "$installDir/MommyCodex.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: MommyCodex-Windows-x64
          path: |
            output/windows-release/*.exe
            output/windows-release/*.zip
            output/windows-release/*.sha256
          if-no-files-found: error
